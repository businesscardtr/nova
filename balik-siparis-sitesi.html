<style>
  :root{
    --deep:#0f2438;
    --deep2:#173350;
    --foam:#eee6d3;
    --coral:#e2574c;
    --coral-dark:#c5433a;
    --teal:#2f7d78;
    --gold:#d9a441;
    --ink:#132030;
    --paper:#fbf6ea;
  }
  *{box-sizing:border-box;}
  .fmp-root{
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    background: var(--deep);
    color: var(--foam);
    min-height:100%;
    padding-bottom:60px;
  }
  .fmp-root, .fmp-root *{ font-family: inherit; }
  .fmp-sans{ font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }

  /* Wave divider, echoes the physical menu's wave motif */
  .fmp-wave{
    width:100%; height:26px; display:block; margin:0 auto;
  }

  .fmp-header{
    position:sticky; top:0; z-index:30;
    background: linear-gradient(180deg, var(--deep) 60%, rgba(15,36,56,0.94));
    padding: 18px 20px 10px;
    border-bottom: 1px solid rgba(238,230,211,0.12);
  }
  .fmp-brand{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .fmp-brand h1{
    margin:0; font-size:28px; letter-spacing:0.5px; font-weight:700; color:var(--foam);
  }
  .fmp-brand h1 span{ color: var(--coral); }
  .fmp-tagline{
    font-family: inherit; font-style: italic; font-size:13px; color: rgba(238,230,211,0.65); margin:2px 0 0;
  }
  .fmp-tabs{
    display:flex; gap:8px; margin-top:14px; font-family:inherit;
  }
  .fmp-tab{
    font-family: inherit;
    background:transparent; border:1px solid rgba(238,230,211,0.3); color: var(--foam);
    padding:7px 16px; border-radius:999px; cursor:pointer; font-size:14px; letter-spacing:0.3px;
    transition: all .15s ease;
  }
  .fmp-tab.active{ background: var(--coral); border-color: var(--coral); color:#fff; font-weight:700; }
  .fmp-tab:hover:not(.active){ border-color: var(--gold); color: var(--gold); }

  .fmp-cartbtn{
    position:relative; margin-left:auto;
  }
  .fmp-cartcount{
    position:absolute; top:-8px; right:-8px; background:var(--gold); color:var(--ink);
    font-family: inherit; font-weight:700; font-size:11px; border-radius:50%;
    width:19px;height:19px;display:flex;align-items:center;justify-content:center;
  }

  .fmp-body{ padding: 18px 20px 0; max-width: 920px; margin:0 auto; }

  .fmp-category-banner{
    display:inline-block; background: var(--coral); color:#fff; font-weight:700;
    padding:8px 22px; border-radius:999px; font-size:15px; letter-spacing:0.6px;
    margin: 26px 0 14px; box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }
  .fmp-category-banner.first{ margin-top:6px; }

  .fmp-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:14px;
  }

  .fmp-card{
    background: var(--deep2); border:1px solid rgba(238,230,211,0.1); border-radius:10px;
    padding:0 0 14px; position:relative; display:flex; flex-direction:column; gap:8px;
    min-height:120px; overflow:hidden;
  }
  .fmp-card-media{
    width:100%; aspect-ratio: 4/3; overflow:hidden; background: var(--deep);
    border-bottom: 2px solid var(--coral);
  }
  .fmp-card-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fmp-card-noimg{
    width:100%; aspect-ratio: 4/3; display:flex; align-items:center; justify-content:center;
    font-size:30px; background: linear-gradient(135deg, var(--deep2), var(--deep));
  }
  .fmp-card > .fmp-card-inner{ padding:0 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .fmp-card h3{ margin:0; font-size:16px; color:var(--foam); line-height:1.25; }

  /* Sticky-note price tag, tilted, echoing the handwritten tags in the real menu */
  .fmp-tag{
    align-self:flex-start;
    background: var(--paper); color: var(--ink);
    font-family: inherit; font-weight:700; font-size:14px;
    padding:3px 10px; border-radius:2px; transform: rotate(-3deg);
    box-shadow: 1px 2px 3px rgba(0,0,0,0.25);
    border:1px solid rgba(0,0,0,0.08);
  }
  .fmp-tag.pending{ color: var(--coral-dark); font-style:italic; font-weight:600; font-size:12px; }

  .fmp-cook-toggle{
    font-family: inherit; font-size:12.5px; display:flex; align-items:center; gap:6px;
    color: rgba(238,230,211,0.85); cursor:pointer; user-select:none;
  }
  .fmp-cook-toggle input{ accent-color: var(--gold); }

  .fmp-addbtn{
    margin-top:auto; font-family: inherit; background: transparent; border:1.5px solid var(--gold);
    color: var(--gold); padding:7px 0; border-radius:999px; cursor:pointer; font-weight:700; font-size:13px;
    transition: all .15s;
  }
  .fmp-addbtn:hover{ background: var(--gold); color: var(--ink); }
  .fmp-addbtn:disabled{ opacity:0.35; cursor:not-allowed; border-color:rgba(238,230,211,0.3); color:rgba(238,230,211,0.5); }
  .fmp-addbtn:disabled:hover{ background:transparent; color:rgba(238,230,211,0.5); }

  /* Cart drawer */
  .fmp-overlay{
    position:fixed; inset:0; background:rgba(10,20,32,0.55); z-index:40; display:none;
  }
  .fmp-overlay.open{ display:block; }
  .fmp-drawer{
    position:fixed; top:0; right:0; height:100%; width:min(420px,92vw); background: var(--paper); color: var(--ink);
    z-index:41; transform: translateX(100%); transition: transform .25s ease; display:flex; flex-direction:column;
  }
  .fmp-drawer.open{ transform: translateX(0); }
  .fmp-drawer-head{ padding:18px 20px 12px; border-bottom:1px solid rgba(15,36,56,0.12); display:flex; justify-content:space-between; align-items:center; }
  .fmp-drawer-head h2{ margin:0; font-size:20px; color: var(--deep); }
  .fmp-close{ background:none;border:none;font-size:22px;cursor:pointer;color:var(--deep); }
  .fmp-drawer-body{ padding:14px 20px; overflow-y:auto; flex:1; }
  .fmp-line{ display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px dashed rgba(15,36,56,0.15); font-size:14px; }
  .fmp-line .fmp-linemeta{ font-size:12px; color: var(--teal); font-style:italic; }
  .fmp-qtybtn{ font-family:inherit; border:1px solid var(--deep); background:#fff; width:24px;height:24px;border-radius:5px;cursor:pointer; }
  .fmp-remove{ background:none;border:none;color:var(--coral-dark);cursor:pointer;font-size:12px;text-decoration:underline; }
  .fmp-drawer-foot{ padding:16px 20px 22px; border-top:1px solid rgba(15,36,56,0.12); }
  .fmp-total{ display:flex; justify-content:space-between; font-weight:700; font-size:18px; margin-bottom:12px; }
  .fmp-checkout-btn{
    width:100%; background: var(--coral); color:#fff; border:none; padding:13px 0; border-radius:8px;
    font-family:inherit; font-weight:700; font-size:15px; cursor:pointer;
  }
  .fmp-checkout-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* Checkout form */
  .fmp-field{ margin-bottom:12px; }
  .fmp-field label{ display:block; font-family: -apple-system,sans-serif; font-size:12px; color:var(--teal); font-weight:700; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.4px; }
  .fmp-field input, .fmp-field textarea{
    width:100%; padding:9px 10px; border:1px solid rgba(15,36,56,0.25); border-radius:6px; font-family: -apple-system,sans-serif; font-size:14px; background:#fff; color:var(--ink);
  }
  .fmp-paymethods{ display:flex; gap:8px; }
  .fmp-paybtn{
    flex:1; font-family: -apple-system,sans-serif; border:1.5px solid rgba(15,36,56,0.25); background:#fff;
    padding:10px 6px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink);
  }
  .fmp-paybtn.selected{ border-color: var(--coral); background: rgba(226,87,76,0.08); color: var(--coral-dark); }

  .fmp-empty{ text-align:center; padding:40px 10px; color: var(--teal); font-style:italic; }

  /* Admin */
  .fmp-admin-gate{ max-width:340px; margin:60px auto; text-align:center; }
  .fmp-admin-gate input{ width:100%; padding:10px; margin:14px 0; border-radius:8px; border:1px solid rgba(238,230,211,0.3); background:var(--deep2); color:var(--foam); font-family: -apple-system,sans-serif; text-align:center; letter-spacing:4px; font-size:18px; }
  .fmp-note{ font-family: -apple-system,sans-serif; font-size:12px; color: rgba(238,230,211,0.55); line-height:1.5; }

  .fmp-order-card{ background: var(--deep2); border-radius:10px; padding:14px 16px; margin-bottom:12px; border:1px solid rgba(238,230,211,0.1); }
  .fmp-order-top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .fmp-order-id{ font-family: -apple-system,sans-serif; font-size:11px; color: rgba(238,230,211,0.5); }
  .fmp-status-pill{
    font-family: -apple-system,sans-serif; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
  }
  .fmp-status-select{ font-family: -apple-system,sans-serif; background: var(--deep); color:var(--foam); border:1px solid rgba(238,230,211,0.3); border-radius:6px; padding:4px 8px; font-size:12px; }
  .fmp-order-items{ margin:8px 0; font-size:14px; }
  .fmp-order-items div{ padding:2px 0; }
  .fmp-order-addr{ font-family: -apple-system,sans-serif; font-size:12.5px; color: rgba(238,230,211,0.8); margin-top:6px; }

  .fmp-price-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(238,230,211,0.08); }
  .fmp-price-row span.name{ flex:1; font-size:14px; }
  .fmp-price-row input{
    width:90px; padding:6px 8px; border-radius:6px; border:1px solid rgba(238,230,211,0.3); background: var(--deep); color: var(--foam); font-family: -apple-system,sans-serif; text-align:right;
  }
  .fmp-savebar{ position:sticky; bottom:0; background: var(--deep); padding:12px 0; margin-top:10px; }
  .fmp-save-btn{ font-family: -apple-system,sans-serif; background: var(--gold); color: var(--ink); border:none; padding:10px 22px; border-radius:8px; font-weight:700; cursor:pointer; }
  .fmp-saved-flash{ font-family: -apple-system,sans-serif; color: var(--gold); font-size:13px; margin-left:12px; }

  .fmp-section-title{ font-size:20px; margin: 8px 0 4px; color: var(--foam); }
  .fmp-subtle{ font-family: -apple-system,sans-serif; color: rgba(238,230,211,0.6); font-size:13px; margin-bottom:16px; }

  @media (max-width:480px){
    .fmp-brand h1{ font-size:22px; }
    .fmp-grid{ grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
  }
</style>

<div class="fmp-root" id="fmp-root"></div>

  async function saveOrders(newOrders){
    state.orders = newOrders;
    try{ await window.storage.set('orders', JSON.stringify(newOrders), true); }catch(e){ console.error('orders save failed', e); }
  }

  function findItem(id){ return state.menu.find(m=>m.id===id); }

  function cartLineTotal(line){
    const item = findItem(line.itemId);
    if(!item || item.price===null) return 0;
    const unit = item.price + (line.cooked ? COOK_SURCHARGE : 0);
    return unit * line.qty;
  }

  function cartTotal(){ return state.cart.reduce((s,l)=>s+cartLineTotal(l),0); }

  function addToCart(itemId, cooked){
    const existing = state.cart.find(l=>l.itemId===itemId && l.cooked===cooked);
    if(existing){ existing.qty += 1; }
    else{ state.cart.push({itemId, cooked, qty:1}); }
    state.drawerOpen = true;
    render();
  }

  function changeQty(idx, delta){
    state.cart[idx].qty += delta;
    if(state.cart[idx].qty <= 0){ state.cart.splice(idx,1); }
    render();
  }

  function removeLine(idx){ state.cart.splice(idx,1); render(); }

  async function submitOrder(){
    if(!state.form.name.trim() || !state.form.phone.trim() || !state.form.address.trim()) return;
    if(state.cart.length===0) return;
    const order = {
      id: 'SP' + Date.now().toString().slice(-8),
      createdAt: new Date().toISOString(),
      customer: {name: state.form.name.trim(), phone: state.form.phone.trim(), address: state.form.address.trim()},
      payment: state.form.pay,
      status: 'Yeni',
      items: state.cart.map(l=>{
        const item = findItem(l.itemId);
        return {
          name: item ? item.name : l.itemId,
          cooked: l.cooked,
          qty: l.qty,
          unitPrice: item ? (item.price + (l.cooked?COOK_SURCHARGE:0)) : 0,
        };
      }),
      total: cartTotal(),
    };
    const newOrders = [order, ...state.orders];
    await saveOrders(newOrders);
    state.orderConfirmed = order;
    state.cart = [];
    state.checkoutOpen = false;
    state.drawerOpen = false;
    state.form = {name:'', phone:'', address:'', pay:'kapida'};
    render();
  }

  async function updateOrderStatus(orderId, status){
    const newOrders = state.orders.map(o=> o.id===orderId ? {...o, status} : o);
    await saveOrders(newOrders);
    render();
  }

  async function savePrices(){
    const newMenu = state.menu.map(item=>{
      const edited = state.priceEdits[item.id];
      if(edited===undefined || edited==='') return item;
      const num = parseFloat(edited.replace(',','.'));
      if(isNaN(num)) return item;
      return {...item, price: num};
    });
    await saveMenu(newMenu);
    state.priceEdits = {};
    state.savedFlash = true;
    render();
    setTimeout(()=>{ state.savedFlash=false; render(); }, 2200);
  }

  function waveSvg(){
    return `<svg class="fmp-wave" viewBox="0 0 400 26" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 14 Q 20 2, 40 14 T 80 14 T 120 14 T 160 14 T 200 14 T 240 14 T 280 14 T 320 14 T 360 14 T 400 14" stroke="#2f7d78" stroke-width="2" fill="none" opacity="0.5"/>
    </svg>`;
  }

  function renderMenuGrid(){
    const cats = CATEGORY_ORDER.filter(c => state.menu.some(m=>m.category===c));
    return cats.map((cat,ci)=>{
      const items = state.menu.filter(m=>m.category===cat);
      const cards = items.map(item=>{
        const priceLabel = item.price===null ? `<div class="fmp-tag pending">Fiyat bekleniyor</div>` : `<div class="fmp-tag">${money(item.price)}</div>`;
        const cookRow = item.cookable ? `
          <label class="fmp-cook-toggle">
            <input type="checkbox" data-cook="${item.id}" ${state.cookToggles && state.cookToggles[item.id] ? 'checked':''}/>
            Pişmiş servis (+${COOK_SURCHARGE}₺)
          </label>` : '';
        const disabled = item.price===null ? 'disabled' : '';
        const media = IMAGES[item.id]
          ? `<div class="fmp-card-media"><img src="${IMAGES[item.id]}" alt="${item.name}" loading="lazy"/></div>`
          : `<div class="fmp-card-noimg">🐟</div>`;
        return `
          <div class="fmp-card">
            ${media}
            <div class="fmp-card-inner">
              <h3>${item.name}</h3>
              ${priceLabel}
              ${cookRow}
              <button class="fmp-addbtn" data-add="${item.id}" ${disabled}>Sepete Ekle</button>
            </div>
          </div>`;
      }).join('');
      return `
        ${ci===0 ? waveSvg() : ''}
        <div class="fmp-category-banner ${ci===0?'first':''}">${cat}</div>
        <div class="fmp-grid">${cards}</div>
      `;
    }).join('');
  }

  function renderDrawer(){
    const lines = state.cart.map((l,idx)=>{
      const item = findItem(l.itemId);
      const name = item ? item.name : l.itemId;
      const meta = l.cooked ? 'Pişmiş servis' : '';
      return `
        <div class="fmp-line">
          <div>
            <div>${name} ${meta ? `<span class="fmp-linemeta">— ${meta}</span>`:''}</div>
            <div style="margin-top:6px;display:flex;align-items:center;gap:8px;">
              <button class="fmp-qtybtn" data-qty-dec="${idx}">−</button>
              <span>${l.qty}</span>
              <button class="fmp-qtybtn" data-qty-inc="${idx}">+</button>
              <button class="fmp-remove" data-remove="${idx}">kaldır</button>
            </div>
          </div>
          <div style="font-weight:700;white-space:nowrap;">${money(cartLineTotal(l))}</div>
        </div>`;
    }).join('');

    const body = state.cart.length===0
      ? `<div class="fmp-empty">Sepetiniz boş.<br/>Menüden taze balık ekleyin 🐟</div>`
      : lines;

    return `
      <div class="fmp-overlay ${state.drawerOpen?'open':''}" id="fmp-overlay"></div>
      <div class="fmp-drawer ${state.drawerOpen?'open':''}">
        <div class="fmp-drawer-head">
          <h2>Sepetiniz</h2>
          <button class="fmp-close" id="fmp-drawer-close">×</button>
        </div>
        <div class="fmp-drawer-body">${body}</div>
        <div class="fmp-drawer-foot">
          <div class="fmp-total"><span>Toplam</span><span>${money(cartTotal())}</span></div>
          <button class="fmp-checkout-btn" id="fmp-open-checkout" ${state.cart.length===0?'disabled':''}>Siparişi Tamamla</button>
        </div>
      </div>
    `;
  }

  function renderCheckout(){
    if(!state.checkoutOpen) return '';
    return `
      <div class="fmp-overlay open" id="fmp-checkout-overlay"></div>
      <div class="fmp-drawer open" style="z-index:42;">
        <div class="fmp-drawer-head">
          <h2>Teslimat Bilgileri</h2>
          <button class="fmp-close" id="fmp-checkout-close">×</button>
        </div>
        <div class="fmp-drawer-body fmp-sans">
          <div class="fmp-field">
            <label>Ad Soyad</label>
            <input type="text" id="fmp-f-name" value="${state.form.name}" placeholder="Adınız Soyadınız"/>
          </div>
          <div class="fmp-field">
            <label>Telefon</label>
            <input type="tel" id="fmp-f-phone" value="${state.form.phone}" placeholder="05xx xxx xx xx"/>
          </div>
          <div class="fmp-field">
            <label>Teslimat Adresi</label>
            <textarea id="fmp-f-address" rows="3" placeholder="Mahalle, sokak, kapı no...">${state.form.address}</textarea>
          </div>
          <div class="fmp-field">
            <label>Ödeme Yöntemi</label>
            <div class="fmp-paymethods">
              <button class="fmp-paybtn ${state.form.pay==='kapida'?'selected':''}" data-pay="kapida">Kapıda Ödeme</button>
              <button class="fmp-paybtn ${state.form.pay==='online'?'selected':''}" data-pay="online">Online Ödeme</button>
            </div>
            ${state.form.pay==='online' ? '<div class="fmp-subtle" style="margin-top:8px;">Demo modunda ödeme simüle edilir. Gerçek ortamda Iyzico ile kart tahsilatı burada tetiklenir.</div>' : ''}
          </div>
          <div class="fmp-total" style="margin-top:20px;"><span>Ödenecek Tutar</span><span>${money(cartTotal())}</span></div>
        </div>
        <div class="fmp-drawer-foot">
          <button class="fmp-checkout-btn" id="fmp-submit-order">Siparişi Onayla</button>
        </div>
      </div>
    `;
  }

  function renderConfirmation(){
    if(!state.orderConfirmed) return '';
    const o = state.orderConfirmed;
    return `
      <div class="fmp-overlay open" id="fmp-confirm-overlay"></div>
      <div class="fmp-drawer open" style="z-index:43;">
        <div class="fmp-drawer-head">
          <h2>Sipariş Alındı 🎣</h2>
          <button class="fmp-close" id="fmp-confirm-close">×</button>
        </div>
        <div class="fmp-drawer-body fmp-sans">
          <p>Sipariş numaranız: <strong>${o.id}</strong></p>
          <p>${o.payment==='kapida' ? 'Ödemenizi kapıda alacağız.' : 'Ödemeniz alındı olarak işaretlendi (demo).'}</p>
          <p>Balığınız hazırlanıp adresinize gönderilecek. Teşekkürler!</p>
        </div>
        <div class="fmp-drawer-foot">
          <button class="fmp-checkout-btn" id="fmp-confirm-ok">Tamam</button>
        </div>
      </div>
    `;
  }

  function renderCustomerView(){
    return `
      ${renderMenuGrid()}
      ${renderDrawer()}
      ${renderCheckout()}
      ${renderConfirmation()}
    `;
  }

  const STATUS_OPTIONS = ['Yeni','Hazırlanıyor','Yolda','Teslim Edildi','İptal'];
  const STATUS_COLORS = {
    'Yeni':'#e2574c','Hazırlanıyor':'#d9a441','Yolda':'#2f7d78','Teslim Edildi':'#4c8c46','İptal':'#7a7a7a'
  };

  function renderAdminOrders(){
    if(state.orders.length===0){
      return `<div class="fmp-empty">Henüz sipariş yok.</div>`;
    }
    return state.orders.map(o=>{
      const itemsHtml = o.items.map(it=>`<div>${it.qty}× ${it.name}${it.cooked?' (pişmiş)':''} — ${money(it.unitPrice*it.qty)}</div>`).join('');
      const color = STATUS_COLORS[o.status] || '#888';
      const dt = new Date(o.createdAt);
      return `
        <div class="fmp-order-card fmp-sans">
          <div class="fmp-order-top">
            <div>
              <strong>${o.customer.name}</strong> — ${o.customer.phone}
              <div class="fmp-order-id">${o.id} · ${dt.toLocaleString('tr-TR')}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="fmp-status-pill" style="background:${color};color:#fff;">${o.status}</span>
              <select class="fmp-status-select" data-status-for="${o.id}">
                ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="fmp-order-items">${itemsHtml}</div>
          <div class="fmp-order-addr">📍 ${o.customer.address}</div>
          <div class="fmp-order-addr">💳 ${o.payment==='kapida'?'Kapıda Ödeme':'Online Ödeme'} · Toplam: <strong>${money(o.total)}</strong></div>
        </div>
      `;
    }).join('');
  }

  function renderAdminPrices(){
    const cats = CATEGORY_ORDER.filter(c => state.menu.some(m=>m.category===c));
    const rows = cats.map(cat=>{
      const items = state.menu.filter(m=>m.category===cat);
      const rowsHtml = items.map(item=>{
        const val = state.priceEdits[item.id] !== undefined ? state.priceEdits[item.id] : (item.price===null?'':item.price);
        return `
          <div class="fmp-price-row">
            <span class="name">${item.name}</span>
            <input type="text" inputmode="decimal" data-price-for="${item.id}" value="${val}" placeholder="₺"/>
          </div>`;
      }).join('');
      return `<div style="margin-top:16px;"><div class="fmp-subtle" style="font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">${cat}</div>${rowsHtml}</div>`;
    }).join('');
    return `
      <div class="fmp-sans">${rows}</div>
      <div class="fmp-savebar">
        <button class="fmp-save-btn" id="fmp-save-prices">Fiyatları Kaydet</button>
        ${state.savedFlash ? '<span class="fmp-saved-flash">Kaydedildi ✓</span>' : ''}
      </div>
    `;
  }

  function renderAdminView(){
    if(!state.adminUnlocked){
      return `
        <div class="fmp-admin-gate fmp-sans">
          <div style="font-size:32px;">🔒</div>
          <h2 class="fmp-sans" style="color:var(--foam);">Restoran Paneli</h2>
          <input type="password" id="fmp-pin" placeholder="PIN" value="${state.pinInput}" maxlength="6"/>
          <button class="fmp-checkout-btn" id="fmp-pin-submit">Giriş Yap</button>
          <p class="fmp-note">Bu basit bir PIN ekranıdır, gerçek bir kimlik doğrulama sistemi değildir. Gerçek kullanımda restoran girişi için uygun bir oturum/parola sistemi kurulmalıdır.</p>
        </div>
      `;
    }
    return `
      <div class="fmp-sans" style="display:flex;gap:10px;margin-bottom:18px;">
        <button class="fmp-tab ${state.adminTab!=='prices'?'active':''}" id="fmp-admintab-orders">Siparişler</button>
        <button class="fmp-tab ${state.adminTab==='prices'?'active':''}" id="fmp-admintab-prices">Fiyat Güncelle</button>
      </div>
      ${state.adminTab==='prices' ? renderAdminPrices() : renderAdminOrders()}
    `;
  }

  function cartCount(){ return state.cart.reduce((s,l)=>s+l.qty,0); }

  function render(){
    if(!state.menu){
      root.innerHTML = `<div style="padding:40px;text-align:center;">Yükleniyor...</div>`;
      return;
    }
    root.innerHTML = `
      <div class="fmp-header">
        <div class="fmp-brand">
          <div>
            <h1>Deniz<span>Kapımda</span></h1>
            <p class="fmp-tagline">taze balık, kapınıza kadar</p>
          </div>
          <div class="fmp-tabs">
            <button class="fmp-tab ${state.view==='customer'?'active':''}" id="fmp-nav-customer">Menü</button>
            <button class="fmp-tab ${state.view==='admin'?'active':''}" id="fmp-nav-admin">Restoran Paneli</button>
            ${state.view==='customer' ? `
              <button class="fmp-tab fmp-cartbtn" id="fmp-nav-cart">Sepet
                ${cartCount()>0 ? `<span class="fmp-cartcount">${cartCount()}</span>` : ''}
              </button>` : ''}
          </div>
        </div>
      </div>
      <div class="fmp-body">
        ${state.view==='customer' ? renderCustomerView() : renderAdminView()}
      </div>
    `;
    bindEvents();
  }

  function bindEvents(){
    const $ = sel => root.querySelector(sel);
    const $$ = sel => root.querySelectorAll(sel);

    const navCustomer = $('#fmp-nav-customer');
    if(navCustomer) navCustomer.onclick = ()=>{ state.view='customer'; render(); };
    const navAdmin = $('#fmp-nav-admin');
    if(navAdmin) navAdmin.onclick = ()=>{ state.view='admin'; state.adminTab='orders'; render(); };
    const navCart = $('#fmp-nav-cart');
    if(navCart) navCart.onclick = ()=>{ state.drawerOpen = true; render(); };

    $$('[data-cook]').forEach(el=>{
      el.onchange = (e)=>{
        state.cookToggles = state.cookToggles || {};
        state.cookToggles[el.getAttribute('data-cook')] = e.target.checked;
      };
    });

    $$('[data-add]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-add');
        const cooked = !!(state.cookToggles && state.cookToggles[id]);
        addToCart(id, cooked);
      };
    });

    const overlay = $('#fmp-overlay');
    if(overlay) overlay.onclick = ()=>{ state.drawerOpen=false; render(); };
    const drawerClose = $('#fmp-drawer-close');
    if(drawerClose) drawerClose.onclick = ()=>{ state.drawerOpen=false; render(); };

    $$('[data-qty-dec]').forEach(el=> el.onclick = ()=> changeQty(parseInt(el.getAttribute('data-qty-dec')), -1));
    $$('[data-qty-inc]').forEach(el=> el.onclick = ()=> changeQty(parseInt(el.getAttribute('data-qty-inc')), 1));
    $$('[data-remove]').forEach(el=> el.onclick = ()=> removeLine(parseInt(el.getAttribute('data-remove'))));

    const openCheckout = $('#fmp-open-checkout');
    if(openCheckout) openCheckout.onclick = ()=>{ state.checkoutOpen = true; state.drawerOpen = false; render(); };
    const checkoutOverlay = $('#fmp-checkout-overlay');
    if(checkoutOverlay) checkoutOverlay.onclick = ()=>{ state.checkoutOpen=false; render(); };
    const checkoutClose = $('#fmp-checkout-close');
    if(checkoutClose) checkoutClose.onclick = ()=>{ state.checkoutOpen=false; render(); };

    const fName = $('#fmp-f-name'); if(fName) fName.oninput = e=> state.form.name = e.target.value;
    const fPhone = $('#fmp-f-phone'); if(fPhone) fPhone.oninput = e=> state.form.phone = e.target.value;
    const fAddr = $('#fmp-f-address'); if(fAddr) fAddr.oninput = e=> state.form.address = e.target.value;
    $$('[data-pay]').forEach(el=> el.onclick = ()=>{ state.form.pay = el.getAttribute('data-pay'); render(); });

    const submitBtn = $('#fmp-submit-order');
    if(submitBtn) submitBtn.onclick = submitOrder;

    const confirmOverlay = $('#fmp-confirm-overlay');
    if(confirmOverlay) confirmOverlay.onclick = ()=>{ state.orderConfirmed=null; render(); };
    const confirmClose = $('#fmp-confirm-close');
    if(confirmClose) confirmClose.onclick = ()=>{ state.orderConfirmed=null; render(); };
    const confirmOk = $('#fmp-confirm-ok');
    if(confirmOk) confirmOk.onclick = ()=>{ state.orderConfirmed=null; render(); };

    const pin = $('#fmp-pin');
    if(pin) pin.oninput = e=> state.pinInput = e.target.value;
    const pinSubmit = $('#fmp-pin-submit');
    if(pinSubmit) pinSubmit.onclick = async ()=>{
      if(state.pinInput === ADMIN_PIN){
        state.adminUnlocked = true;
        state.adminTab = 'orders';
        state.pinInput = '';
        await loadOrders();
      }
      render();
    };

    const adminTabOrders = $('#fmp-admintab-orders');
    if(adminTabOrders) adminTabOrders.onclick = ()=>{ state.adminTab='orders'; render(); };
    const adminTabPrices = $('#fmp-admintab-prices');
    if(adminTabPrices) adminTabPrices.onclick = ()=>{ state.adminTab='prices'; render(); };

    $$('[data-status-for]').forEach(el=>{
      el.onchange = (e)=> updateOrderStatus(el.getAttribute('data-status-for'), e.target.value);
    });

    $$('[data-price-for]').forEach(el=>{
      el.oninput = (e)=>{ state.priceEdits[el.getAttribute('data-price-for')] = e.target.value; };
    });

    const savePrices = $('#fmp-save-prices');
    if(savePrices) savePrices.onclick = savePrices_wrapper;
  }

  async function savePrices_wrapper(){ await savePrices(); }

  loadMenu();
  loadOrders();
})();
</script>
